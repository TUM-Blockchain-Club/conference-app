# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "asmara-conference-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false

[edge_runtime]
enabled = true

# Called by the announcements_send_push trigger through pg_net, which sends no
# Authorization header. Safe without JWT verification: the request carries only
# an announcement id, and the function acts on server-side state alone — it
# claims the row atomically and never sends a draft or anything twice. See the
# header of supabase/functions/send-announcement/index.ts.
[functions.send-announcement]
verify_jwt = false
